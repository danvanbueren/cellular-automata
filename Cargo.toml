[package]
name = "cellular-automata"
version = "1.0.0"
edition = "2024"
default-run = "cellular-desktop"

[lib]
name = "cellular_automata"
path = "src/lib.rs"

# Name the desktop executable distinctly to avoid Windows MSVC .pdb symbol collisions
[[bin]]
name = "cellular-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
