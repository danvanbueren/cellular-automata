[package]
name = "cellular-automata"
version = "0.1.0"
edition = "2024"

[lib]
name = "cellular_automata"
crate-type = ["cdylib", "rlib"]

# Name the desktop executable distinctly to avoid Windows .pdb symbol collisions
[[bin]]
name = "cellular-desktop"
path = "src/main.rs"

[dependencies]
wasm-bindgen = "0.2"

# Only compile minifb when building for desktop OS, not for WebAssembly
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = "0.29.0"
